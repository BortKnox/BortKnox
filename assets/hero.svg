<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="BortKnox. Small machines, carefully built. Single-file tools, hardware simulators and desktop agents.">
<title>BortKnox. Small machines, carefully built. Single-file tools, hardware simulators and desktop agents.</title>
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".8" fill="#a6ad9c" fill-opacity=".45"/></pattern></defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.flow{stroke-dasharray:8 30;animation:flow 1.8s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-38}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="959" height="429" rx="10" fill="#eeede5" stroke="#aeb3a3"/>
<rect x="1" y="1" width="958" height="428" rx="10" fill="url(#dots)"/>
<defs><linearGradient id="mh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafaf4"/><stop offset="1" stop-color="#f0f1e8"/></linearGradient><clipPath id="clip"><rect x=".5" y=".5" width="959" height="429" rx="10"/></clipPath></defs>
