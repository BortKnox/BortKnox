<text class="m" x="68" y="111" font-size="10" font-weight="700" letter-spacing="1.8" fill="#242b25">FIELD STATION / PERSONAL BUILD LOG</text>
<text x="44" y="196" font-size="82" font-weight="600" letter-spacing="-5" fill="#242b25">Small machines,</text>
<text x="44" y="278" font-size="82" font-weight="600" letter-spacing="-4" fill="#242b25"><tspan class="s" fill="#a83e1d" letter-spacing="-3">carefully</tspan> built.</text>
<text x="48" y="326" font-size="16" fill="#242b25">Single-file tools, hardware simulators and desktop agents,</text>
<text x="48" y="348" font-size="16" fill="#63695e">designed before they are coded and released in the open.</text>
