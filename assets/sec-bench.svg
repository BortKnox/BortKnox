<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 96" width="960" height="96" role="img" aria-label="01 On the bench">
<title>01 On the bench</title>
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".8" fill="#a6ad9c" fill-opacity=".45"/></pattern></defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.flow{stroke-dasharray:8 30;animation:flow 1.8s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-38}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="959" height="95" rx="8" fill="#eeede5" stroke="#aeb3a3"/>
<rect x="1" y="1" width="958" height="94" rx="8" fill="url(#dots)"/>
<rect x="24" y="22" width="9" height="9" fill="#e36336"/>
<text class="m" x="44" y="31" font-size="10" font-weight="700" letter-spacing="2" fill="#242b25">01</text>
<text class="m" x="82" y="31" font-size="10" letter-spacing="2" fill="#63695e">UNITS CURRENTLY SHIPPING</text>
<text x="24" y="76" font-size="34" font-weight="600" letter-spacing="-1.8" fill="#242b25">On the <tspan class="s" fill="#a83e1d" letter-spacing="-1">bench</tspan></text>
<path d="M696.5 20v10M708.5 20v5M720.5 20v5M732.5 20v5M744.5 20v5M756.5 20v10M768.5 20v5M780.5 20v5M792.5 20v5M804.5 20v5M816.5 20v10M828.5 20v5M840.5 20v5M852.5 20v5M864.5 20v5M876.5 20v10M888.5 20v5M900.5 20v5M912.5 20v5M924.5 20v5M936.5 20v10" stroke="#242b25" stroke-width="1" fill="none"/>
</svg>
