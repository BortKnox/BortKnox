<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 214" width="960" height="214" role="img" aria-label="Spec readout. Unit BortKnox, Australia. Single-file tools, simulators and agents. Ask about ESP32, board design, retrofits and Python diagnostics. Built for my bench, shared open.">
<title>Spec readout. Unit BortKnox, Australia. Single-file tools, simulators and agents. Ask about ESP32, board design, retrofits and Python diagnostics. Built for my bench, shared open.</title>
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".8" fill="#a6ad9c" fill-opacity=".45"/></pattern></defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.flow{stroke-dasharray:8 30;animation:flow 1.8s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-38}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="959" height="213" rx="10" fill="#eeede5" stroke="#aeb3a3"/>
<rect x="1" y="1" width="958" height="212" rx="10" fill="url(#dots)"/>
<rect x="20" y="20" width="612" height="174" rx="4" fill="#1b1f1b"/>
<rect x="26" y="26" width="600" height="162" fill="#070907"/>
<rect x="26" y="26" width="600" height="22" fill="#e36336"/>
<text class="m" x="38" y="41" font-size="11" font-weight="700" letter-spacing="1.4" fill="#120d08">BK-01 / FIELD UNIT</text>
<text class="m" x="614" y="41" font-size="11" font-weight="700" letter-spacing="1.4" text-anchor="end" fill="#120d08">ONLINE</text>
<text class="m" x="40" y="72" font-size="12" letter-spacing=".8" fill="#7f8a74">UNIT</text>
<text class="m" x="132" y="72" font-size="12" letter-spacing=".8" fill="#e9efd8">BORTKNOX</text>
<text class="m" x="40" y="94" font-size="12" letter-spacing=".8" fill="#7f8a74">LOCATION</text>
<text class="m" x="132" y="94" font-size="12" letter-spacing=".8" fill="#e9efd8">AUSTRALIA</text>
<text class="m" x="40" y="116" font-size="12" letter-spacing=".8" fill="#7f8a74">FOCUS</text>
<text class="m" x="132" y="116" font-size="12" letter-spacing=".8" fill="#e9efd8">SINGLE-FILE TOOLS / SIMULATORS / AGENTS</text>
<text class="m" x="40" y="138" font-size="12" letter-spacing=".8" fill="#7f8a74">ASK ME</text>
<text class="m" x="132" y="138" font-size="12" letter-spacing=".8" fill="#e9efd8">ESP32 / BOARD DESIGN / RETROFITS / PYTHON</text>
<text class="m" x="40" y="160" font-size="12" letter-spacing=".8" fill="#7f8a74">POLICY</text>
<text class="m" x="132" y="160" font-size="12" letter-spacing=".8" fill="#e9efd8">BUILT FOR MY BENCH. SHARED OPEN.</text>
<rect class="blink" x="40" y="176" width="8" height="13" fill="#d8e6ab"/>
<text class="m" x="56" y="186" font-size="12" letter-spacing=".8" fill="#7f8a74">READY</text>
<text class="m" x="668" y="44" font-size="9" font-weight="700" letter-spacing="1.8" fill="#242b25">READOUT NOTES</text>
<path d="M668 54.5H940" stroke="#242b25"/>
<text x="668" y="84" font-size="13" fill="#242b25">Built for my own bench and public so</text>
<text x="668" y="104" font-size="13" fill="#242b25">anyone can read, fork or borrow.</text>
<text x="668" y="124" font-size="13" fill="#242b25">Issues and pull requests may sit</text>
<text x="668" y="144" font-size="13" fill="#242b25">unanswered. Forking is always the</text>
<text x="668" y="164" font-size="13" fill="#242b25">right move.</text>
<circle cx="676" cy="184" r="5" fill="#e36336" stroke="#242b25" stroke-opacity=".5"/>
<text class="m" x="687" y="187" font-size="9" letter-spacing="1" fill="#63695e">A</text>
<circle cx="720" cy="184" r="5" fill="#7FB0D8" stroke="#242b25" stroke-opacity=".5"/>
<text class="m" x="731" y="187" font-size="9" letter-spacing="1" fill="#63695e">B</text>
<circle cx="764" cy="184" r="5" fill="#d8e6ab" stroke="#242b25" stroke-opacity=".5"/>
<text class="m" x="775" y="187" font-size="9" letter-spacing="1" fill="#63695e">C</text>
</svg>
